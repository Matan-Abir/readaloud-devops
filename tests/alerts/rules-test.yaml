rule_files: [rules.yaml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{namespace="staging", service="readaloud-backend", pod="a"}'
        values: '1x8 0x12'
    alert_rule_test:
      - eval_time: 1m
        alertname: ReadAloudBackendDown
        exp_alerts: []
      - eval_time: 4m
        alertname: ReadAloudBackendDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: staging}
            exp_annotations:
              summary: ReadAloud backend in staging is down
              description: Prometheus has not reached any backend pod in staging for a minute.
              runbook_url: https://github.com/Matan-Abir/readaloud-devops/blob/master/docs/RUNBOOK.md#backend-down
  - interval: 15s
    input_series:
      - series: 'flask_http_request_total{namespace="staging", status="500"}'
        values: '0+3x40'
      - series: 'flask_http_request_total{namespace="staging", status="200"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: ReadAloudHighErrorRate
        exp_alerts:
          - exp_labels: {severity: warning, namespace: staging}
            exp_annotations:
              summary: More than 5% of API requests in staging fail with 5xx
              description: 5xx ratio is 23.08%.
              runbook_url: https://github.com/Matan-Abir/readaloud-devops/blob/master/docs/RUNBOOK.md#high-error-rate
