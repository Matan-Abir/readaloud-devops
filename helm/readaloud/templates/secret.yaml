{{- if not .Values.secrets.existingSecret }}
{{- /* Reuse values already in the cluster on upgrade so random defaults stay stable. */ -}}
{{- $name := printf "%s-secret" (include "readaloud.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict -}}
{{- $data := get $existing "data" | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "readaloud.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | b64enc | default (get $data "JWT_SECRET_KEY") | default (randAlphaNum 48 | b64enc) | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | default (get $data "POSTGRES_PASSWORD") | default (randAlphaNum 24 | b64enc) | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | default (get $data "GEMINI_API_KEY") | default "" | quote }}
{{- end }}
