# AWS (k3s on one EC2 instance), layered on top of values-prod.yaml.
# Argo CD renders the chart with both files (terraform/cloud-platform/gitops,
# ADR 0008) and adds ingress.host and secrets.existingSecret as parameters.

# Images that GitHub Actions in readaloud-app pushes to GHCR on every merge to
# master (public packages, so the cluster needs no pull secret). Argo CD Image
# Updater replaces `latest` with `latest@sha256:<digest>` of the newest build,
# which pins the exact image and triggers the rolling update.
backend:
  image:
    repository: ghcr.io/matan-abir/readaloud-backend
    tag: latest
    pullPolicy: Always

web:
  image:
    repository: ghcr.io/matan-abir/readaloud-web
    tag: latest
    pullPolicy: Always

config:
  GEMINI_MODEL: gemini-3.5-flash-lite

# k3s ships Traefik, not ingress-nginx. Traefik ignores the chart's nginx.*
# annotations; it has no body size limit and doesn't time out waiting for the
# backend, so slow Gemini answers work. (It does give a client 60 s to send a
# request, plenty for a PDF upload.)
ingress:
  className: traefik
