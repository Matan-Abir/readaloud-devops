# kube-prometheus-stack, sized for one Minikube node on a 16 GB laptop.
# Rendered by Terraform (templatefile): the three hostnames come from
# var.base_domain. Alertmanager's routing is added from main.tf.

# Short, predictable names: services kps-prometheus, kps-alertmanager, grafana.
fullnameOverride: kps

# Control-plane components aren't reachable for scraping on Minikube; turning
# them off avoids alerts that would always fire.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
windowsMonitoring:
  enabled: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [${prometheus}]
    paths: [/]
  prometheusSpec:
    externalUrl: http://${prometheus}
    # Pick up ServiceMonitors and PrometheusRules from every namespace and
    # release (the ReadAloud chart ships its own in dev and staging).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 3d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [${alertmanager}]
    paths: [/]
  alertmanagerSpec:
    externalUrl: http://${alertmanager}
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  fullnameOverride: grafana
  # adminPassword comes from Terraform (sensitive).
  defaultDashboardsTimezone: browser
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [${grafana}]
  grafana.ini:
    server:
      root_url: http://${grafana}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
