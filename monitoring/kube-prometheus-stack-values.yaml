# Values for prometheus-community/kube-prometheus-stack, installed by terraform/main.tf.
# Sized for a single-node Minikube on a 16 GB laptop.

# Control-plane components are not scrapeable on Minikube; disabling avoids false alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace and release
    # (the ReadAloud chart ships its own).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - receiver: "readaloud-team"
          matchers:
            - alertname =~ "ReadAloud.*"
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      # Replace with Slack / email for real use, e.g.
      #   slack_configs:
      #     - api_url_file: /etc/alertmanager/secrets/slack/url
      #       channel: "#readaloud-alerts"
      #       send_resolved: true
      - name: "readaloud-team"
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  # adminPassword is set from Terraform (sensitive variable).
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
